<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AssetIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/aiq.css">
</head>
<body data-screen="home">

<div id="page" class="page">
  <div class="phead">
    <div class="row">
      <div>
        <h1 id="hd">Lake command</h1>
        <p class="sub" id="hsub"></p>
      </div>
      <p class="verdict" id="verdict"></p>
    </div>
  </div>

  <dl class="stat-row" id="stats"></dl>

  <div class="sec-h"><h2>Needs attention</h2><p>Open the parameter to see the events behind it</p></div>
  <div class="tiles" id="attention"></div>

  <div class="sec-h"><h2>The asset</h2><p>What is protected, and on what evidence</p></div>
  <div class="tiles" id="asset"></div>

  <div class="sec-h"><h2>Act and report</h2><p>Where a decision is recorded and where it comes out</p></div>
  <div class="tiles" id="act"></div>

  <footer class="site">
    <p id="dataline"></p>
  </footer>
</div>

<script src="assets/js/aiq-data.js"></script>
<script src="assets/js/aiq-map.js"></script>
<script src="assets/js/aiq-shell.js"></script>
<script>
AIQShell.boot(async (data) => {
  const ov = data.officer_view, works = data.restoration_works;
  const asOf = ov.as_of.slice(0, 10);
  const enc = data.encroachment_summary;
  const byId = Object.fromEntries(data.events.map(e => [e.id, AIQ.withAction(e)]));
  const settled = id => !AIQ.isOpen(byId[id]);
  const overdue = ov.overdue.filter(id => !settled(id));
  const decisions = ov.needs_decision_today.filter(d => !settled(d.event));

  /* this screen is the officer's home; the other roles are sent to their own,
     so there is no role-dependent heading to set here */
  document.getElementById("hsub").textContent =
    `${data.asset.display_name} · ${AIQ.custody(data.asset.custody_state)} since ` +
    `${AIQ.date(data.custody_history.at(-1).date)} · one site, ${data.events.length} events in the pilot period`;
  document.getElementById("verdict").innerHTML =
    `<span class="dot ${ov.overall_status}"></span> <span class="reason">${ov.status_reason}</span>`;
  document.getElementById("dataline").textContent = data.meta.disclaimer;

  /* headline figures */
  const stats = [
    ["Decisions today", decisions.length, ""],
    ["Overdue", overdue.length, ""],
    ["Open events", data.events.map(AIQ.withAction).filter(AIQ.isOpen).length, ""],
    ["Restoration", works.precomputed_progress.overall_pct + "%", "by sanctioned value"],
    ["Encroachment", enc.open, "cases open"],
    ["Perimeter fenced", data.perimeter.fenced_m + " m", "of " + AIQ.num(data.perimeter.total_m) + " m"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([k, v, s]) =>
    `<div class="stat"><dt>${k}</dt><dd>${v}${s ? ` <small>${s}</small>` : ""}</dd></div>`).join("");

  /* one tile per monitoring parameter, worst first */
  const params = data.parameters.map(p => Object.assign({}, p, AIQ.health(data, p.key)));
  const rank = { red: 0, amber: 1, green: 2 };
  params.sort((a, b) => rank[a.status] - rank[b.status] || b.open - a.open);
  document.getElementById("attention").innerHTML = params.map(p => `
    <a class="tile ${p.status}" href="alerts.html#p=${p.key}">
      <div class="tile-k">
        <span class="tile-t">${p.name}</span>
        <span class="tile-n ${p.open ? "" : "sm"}">${p.open || "—"}</span>
      </div>
      <p class="tile-d">${p.what}</p>
      <p class="tile-f">${p.late ? `${p.late} overdue · ` : ""}${p.open ? `${p.open} open of ${p.total}` : `nothing open`}</p>
    </a>`).join("");

  /* the asset */
  const disc = data.record_discrepancies.filter(d => d.status === "escalated_for_ruling").length;
  const nextStage = data.lifecycle.stages.find(s => !s.reached_on);
  document.getElementById("asset").innerHTML = [
    { href: "baseline.html", t: "Boundary and records", n: data.spatial_baseline.ftl_area_ha + " ha",
      d: "The accepted FTL line, and where the departmental records disagree with it.",
      f: disc ? `${disc} dispute awaiting a ruling` : "No open dispute", s: disc ? "amber" : "green" },
    { href: "survey.html", t: "Survey numbers", n: data.survey_parcels.length,
      d: "Revenue parcels touching the lake, with classification, extent and holder.",
      f: `${data.survey_summary.parcels_adjoining_buffer} parcels adjoin the buffer`, s: "" },
    { href: "perimeter.html", t: "Perimeter and bund", n: AIQ.num(data.perimeter.total_m) + " m",
      d: "Protection segment by segment: bund, bank, fencing and condition.",
      f: `${data.perimeter.fenced_m} m fenced · ${data.perimeter.segments.filter(x => x.condition === "At risk").length} segments at risk`,
      s: "amber" },
    { href: "lifecycle.html", t: "Lake lifecycle", n: "5 of 6",
      d: "Custody stage, what it took to get here and what the next stage requires.",
      f: nextStage ? `Next: ${nextStage.name}` : "Fully protected", s: "" },
    { href: "change.html", t: "Change detection", n: data.change_detection.passes.at(-1).candidates,
      d: "Each drone pass compared against the baseline, candidates reviewed by a person.",
      f: `${data.change_detection.passes.at(-1).confirmed} confirmed, ${data.change_detection.passes.at(-1).rejected} rejected`,
      s: "" },
  ].map(tileHTML).join("");

  /* act and report */
  const nextDue = data.compliance_targets.slice().sort((a, b) => a.next_due < b.next_due ? -1 : 1)[0];
  document.getElementById("act").innerHTML = [
    { href: "encroachment.html", t: "Encroachment cases", n: enc.open,
      d: "Each case from detection through verification to removal, keyed to a survey number.",
      f: `${enc.area_open_ac} ac open · ${enc.area_recovered_ac} ac recovered`, s: enc.open ? "amber" : "green" },
    { href: "works.html", t: "Restoration progress", n: works.precomputed_progress.overall_pct + "%",
      d: "Measured quantity against sanctioned quantity, check-measured by a second officer.",
      f: `${works.measurements.length} measurement entries`, s: "" },
    { href: "field.html", t: "Field capture", n: data.field_forms.length,
      d: "The forms field staff use, with geo-fence, photograph rule and offline queue.",
      f: `${data.field_capture_summary.completion_pct}% of scheduled captures completed`, s: "green" },
    { href: "compliance.html", t: "Compliance submissions", n: data.compliance_targets.length,
      d: "One dataset, one draft per authority, assembled from the same records.",
      f: `Next due ${AIQ.date(nextDue.next_due)}`, s: "amber" },
    { href: "department.html", t: "Department view", n: data.department_view.departments.length,
      d: "What each department holds, what it is being asked for and by when.",
      f: `${data.department_view.departments.filter(x => x.status === "Overdue").length} overdue`, s: "amber" },
    { href: "public.html", t: "Public view", n: data.public_view.citizen_reports.received,
      d: "What a public page may show, what it must withhold, and why.",
      f: `${data.public_view.citizen_reports.received} citizen reports received`, s: "" },
    { href: "amenity.html", t: "Amenity suitability", n: data.beautification.candidates.filter(c => c.verdict === "Meets every check").length,
      d: "Candidate land for public amenity — outside the FTL and outside the buffer only.",
      f: `${data.beautification.candidates.length} parcels assessed`, s: "grey" },
  ].map(tileHTML).join("");

  function tileHTML(x) {
    return `<a class="tile ${x.s}" href="${x.href}">
      <div class="tile-k"><span class="tile-t">${x.t}</span><span class="tile-n sm">${x.n}</span></div>
      <p class="tile-d">${x.d}</p>
      <p class="tile-f">${x.f}</p>
    </a>`;
  }
});
</script>
</body>
</html>
